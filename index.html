<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CueCraft Lounge - Pool Table Reservation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        felt: { 500: '#10b981', 600: '#059669', 800: '#065f46', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f17; color: #f3f4f6; }
        .billiard-table-cloth { background: radial-gradient(circle, #059669 0%, #047857 70%, #064e3b 100%); }
        .billiard-wood-frame { background: linear-gradient(145deg, #5c2d12, #2a1205); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-felt-600 flex items-center justify-center font-bold text-white">8</div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">CUECRAFT <span class="text-felt-500 text-sm">Lounge</span></h1>
            </div>

            <div class="flex items-center gap-4">
                <div id="admin-controls" class="flex items-center gap-2">
                    <button id="admin-toggle-btn" class="px-3 py-2 rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-400 text-xs font-semibold">Admin Login</button>
                    <button id="admin-logout-btn" class="px-3 py-2 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 text-xs font-semibold hidden">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
        
        <!-- Controls & Date Selection -->
        <div class="bg-gray-900/80 rounded-2xl p-4 border border-gray-800 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Booking Date</label>
                    <input type="date" id="selected-date" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                </div>
                <div id="timeslot-filter-container">
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Time Slot</label>
                    <select id="selected-time-slot" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white"></select>
                </div>
            </div>
        </div>

        <!-- USER VIEW: Floor Plan Grid -->
        <section id="user-view">
            <div id="pool-table-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>

        <!-- ADMIN VIEW PANEL -->
        <section id="admin-view" class="hidden space-y-6">
            
            <!-- ADMIN TABS NAVIGATION -->
            <div class="flex border-b border-gray-800 space-x-4">
                <button id="tab-btn-matrix" onclick="switchAdminTab('matrix')" class="py-3 px-4 text-sm font-bold border-b-2 border-amber-500 text-amber-400 transition-all">Full Day Matrix</button>
                <button id="tab-btn-actions" onclick="switchAdminTab('actions')" class="py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white transition-all">Action Items</button>
                <button id="tab-btn-bookings" onclick="switchAdminTab('bookings')" class="py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white transition-all">Booking Information</button>
            </div>

            <!-- TAB 1: Full Day Matrix (View Only) -->
            <div id="admin-tab-matrix" class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-white">Full Day Availability Schedule Matrix</h3>
                    <span id="matrix-date-label" class="text-xs font-semibold text-felt-400"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-center text-xs border-collapse">
                        <thead id="matrix-head" class="bg-gray-950 text-gray-400 border-b border-gray-800"></thead>
                        <tbody id="matrix-body" class="divide-y divide-gray-800"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: Action Items -->
            <div id="admin-tab-actions" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hidden">
                <h3 class="text-lg font-bold text-amber-400 mb-4">Admin Action Management</h3>
                <form id="action-items-form" class="space-y-4 max-w-2xl">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Action Type</label>
                        <select id="action-type" onchange="toggleActionFields()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                            <option value="WALK_IN">Walk In</option>
                            <option value="RESERVED">Reserve (League / Bulk)</option>
                            <option value="MAINTENANCE">Maintenance</option>
                        </select>
                    </div>

                    <div id="walkin-price-container">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Price (R)</label>
                        <input type="number" id="action-price" placeholder="Enter custom walk-in price" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Select Tables</label>
                        <div id="action-tables-container" class="grid grid-cols-3 md:grid-cols-6 gap-2 bg-gray-950 border border-gray-700 rounded-xl p-3"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Select Time Slots</label>
                        <div id="action-slots-container" class="grid grid-cols-2 md:grid-cols-3 gap-2 bg-gray-950 border border-gray-700 rounded-xl p-3 max-h-48 overflow-y-auto"></div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl transition-all">Apply Action Item</button>
                </form>
            </div>

            <!-- TAB 3: Booking Information & Payments -->
            <div id="admin-tab-bookings" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hidden">
                <h3 class="text-lg font-bold text-white mb-4">All Active Bookings & Payment Status</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-300">
                        <thead class="text-xs uppercase bg-gray-950 text-gray-400 border-b border-gray-800">
                            <tr>
                                <th class="p-3">Ref ID</th>
                                <th class="p-3">Customer / Type</th>
                                <th class="p-3">Slot</th>
                                <th class="p-3">Table</th>
                                <th class="p-3">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="admin-bookings-list" class="divide-y divide-gray-800"></tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <!-- Modal: New Booking -->
    <div id="booking-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-white mb-2">Reserve Table <span id="modal-table-num"></span></h3>
            <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 mb-4 text-xs space-y-1">
                <div class="flex justify-between text-gray-400"><span>Table Rate:</span> <span id="modal-base-price">R0</span></div>
                <div class="flex justify-between text-gray-400"><span>Booking Fee:</span> <span class="text-amber-400">+R15</span></div>
                <div class="border-t border-gray-800 pt-1 flex justify-between font-bold text-white"><span>Total Due:</span> <span id="modal-total-price" class="text-felt-400">R0</span></div>
            </div>
            <form id="booking-form" class="space-y-4">
                <input type="hidden" id="form-table-id">
                <input type="hidden" id="form-total-price">
                <input type="text" id="form-user-name" required placeholder="Your Name" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                <input type="tel" id="form-user-phone" required placeholder="Phone Number" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                
                <p class="text-xs text-amber-400 font-medium italic">* Paystack online payment integration coming soon.</p>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-booking-btn" class="w-1/2 py-2 border border-gray-700 rounded-xl text-gray-300">Cancel</button>
                    <button type="submit" class="w-1/2 py-2 bg-felt-600 rounded-xl text-white font-bold">Confirm Reservation</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Admin Password Prompt -->
    <div id="admin-auth-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-amber-500/30 rounded-2xl max-w-sm w-full p-6">
            <h3 class="text-lg font-bold text-amber-400 mb-2">Admin Portal Login</h3>
            <input type="password" id="admin-password-input" placeholder="Enter Password" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white mb-4">
            <div class="flex gap-2">
                <button id="cancel-admin-btn" class="w-1/2 py-2 border border-gray-700 rounded-xl text-gray-300">Cancel</button>
                <button id="login-admin-btn" class="w-1/2 py-2 bg-amber-500 text-black font-bold rounded-xl">Login</button>
            </div>
        </div>
    </div>

    <script>
        const OPERATING_SLOTS = [
            "11:00 AM - 12:00 PM", "12:00 PM - 01:00 PM", "01:00 PM - 02:00 PM",
            "02:00 PM - 03:00 PM", "03:00 PM - 04:00 PM", "04:00 PM - 05:00 PM",
            "05:00 PM - 06:00 PM", "06:00 PM - 07:00 PM", "07:00 PM - 08:00 PM",
            "08:00 PM - 09:00 PM", "09:00 PM - 10:00 PM", "10:00 PM - 11:00 PM"
        ];

        let userId = localStorage.getItem('cuecraft_user_id') || 'usr_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('cuecraft_user_id', userId);

        let appState = {
            isAdmin: false,
            adminToken: '',
            tables: [],
            bookings: [],
            allDateBookings: [],
            selectedDate: new Date().toISOString().split('T')[0],
            selectedSlot: "02:00 PM - 03:00 PM"
        };

        window.addEventListener('DOMContentLoaded', () => {
            const slotSelect = document.getElementById('selected-time-slot');
            if (slotSelect) {
                OPERATING_SLOTS.forEach(slot => {
                    const opt = document.createElement('option');
                    opt.value = slot;
                    opt.innerText = slot;
                    if (slot === appState.selectedSlot) opt.selected = true;
                    slotSelect.appendChild(opt);
                });
            }

            document.getElementById('selected-date').value = appState.selectedDate;
            document.getElementById('selected-date').addEventListener('change', onFilterChange);
            document.getElementById('selected-time-slot').addEventListener('change', onFilterChange);
            
            document.getElementById('admin-toggle-btn').addEventListener('click', openAdminAuthModal);
            document.getElementById('admin-logout-btn').addEventListener('click', adminLogout);
            document.getElementById('cancel-admin-btn').addEventListener('click', closeAdminModal);
            document.getElementById('login-admin-btn').addEventListener('click', verifyAdminPassword);
            
            document.getElementById('cancel-booking-btn').addEventListener('click', closeBookingModal);
            document.getElementById('booking-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('action-items-form').addEventListener('submit', handleActionFormSubmit);

            loadData();
        });

        function switchAdminTab(tab) {
            ['matrix', 'actions', 'bookings'].forEach(t => {
                const el = document.getElementById(`admin-tab-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    el.classList.remove('hidden');
                    btn.className = "py-3 px-4 text-sm font-bold border-b-2 border-amber-500 text-amber-400 transition-all";
                } else {
                    el.classList.add('hidden');
                    btn.className = "py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-white transition-all";
                }
            });
        }

        async function loadData() {
            try {
                const tablesRes = await fetch('/api/tables');
                const tablesData = await tablesRes.json();
                appState.tables = Array.isArray(tablesData) ? tablesData : [];

                if (appState.isAdmin) {
                    await loadAdminData();
                    populateActionFormControls();
                } else {
                    const bookingsRes = await fetch(`/api/bookings?date=${appState.selectedDate}&slot=${encodeURIComponent(appState.selectedSlot)}`);
                    const bookingsData = await bookingsRes.json();
                    appState.bookings = Array.isArray(bookingsData) ? bookingsData : [];
                    renderFloorPlan();
                }
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        async function loadAdminData() {
            try {
                const dayBookingsRes = await fetch(`/api/admin/day-bookings?date=${appState.selectedDate}`, { 
                    headers: { 'x-admin-password': appState.adminToken } 
                });

                appState.allDateBookings = await dayBookingsRes.json();
                renderMatrix();
                renderAdminBookings(appState.allDateBookings);
            } catch (err) {
                console.error('Error loading admin data:', err);
            }
        }

        function renderMatrix() {
            document.getElementById('matrix-date-label').innerText = `Date: ${appState.selectedDate}`;
            const head = document.getElementById('matrix-head');
            const body = document.getElementById('matrix-body');

            head.innerHTML = '';
            body.innerHTML = '';

            const trHead = document.createElement('tr');
            trHead.innerHTML = `<th class="p-2 border border-gray-800 bg-gray-950 text-left">Table</th>` + 
                OPERATING_SLOTS.map(slot => `<th class="p-2 border border-gray-800 text-center min-w-[90px]">${slot.split(' - ')[0]}</th>`).join('');
            head.appendChild(trHead);

            appState.tables.forEach(table => {
                const tr = document.createElement('tr');
                let rowHtml = `<td class="p-2 border border-gray-800 font-bold text-white bg-gray-950 text-left">${table.name || 'Table ' + table.id}</td>`;

                OPERATING_SLOTS.forEach(slot => {
                    const booking = appState.allDateBookings.find(b => b.table_id === table.id && (b.time_slot === slot || b.slot === slot));
                    
                    let bg = "bg-emerald-950/40 text-emerald-400";
                    let label = "Free";

                    if (booking) {
                        if (booking.status === 'CONFIRMED' || booking.status === 'RESERVED') {
                            bg = "bg-rose-950/60 text-rose-400 font-semibold";
                            label = "Booked";
                        } else if (booking.status === 'WALK_IN') {
                            bg = "bg-blue-950/60 text-blue-400 font-semibold";
                            label = "Walk-In";
                        } else if (booking.status === 'MAINTENANCE') {
                            bg = "bg-gray-800 text-gray-400";
                            label = "Maintenance";
                        }
                    }

                    rowHtml += `<td class="p-2 border border-gray-800 ${bg}">${label}</td>`;
                });

                tr.innerHTML = rowHtml;
                body.appendChild(tr);
            });
        }

        function renderAdminBookings(bookings) {
            const container = document.getElementById('admin-bookings-list');
            container.innerHTML = '';

            if (!bookings || bookings.length === 0) {
                container.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No bookings for this date.</td></tr>`;
                return;
            }

            bookings.forEach(b => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-950/50";

                const isPaid = b.payment_status === 'PAID';
                const payBadge = isPaid 
                    ? `<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-semibold">PAID (${b.payment_method || 'N/A'})</span>` 
                    : `<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 text-xs font-semibold">UNPAID</span>`;

                tr.innerHTML = `
                    <td class="p-3 font-mono text-xs text-amber-400">${b.ref_id || 'N/A'}</td>
                    <td class="p-3 font-semibold text-white">${b.user_name || 'N/A'}</td>
                    <td class="p-3 text-xs text-gray-300">${b.time_slot || b.slot}</td>
                    <td class="p-3">Table ${b.table_id}</td>
                    <td class="p-3 font-semibold text-felt-400">R${b.total_price || 0}</td>
                  
                `;
                container.appendChild(tr);
            });
        }

        function populateActionFormControls() {
            const tablesContainer = document.getElementById('action-tables-container');
            const slotsContainer = document.getElementById('action-slots-container');

            tablesContainer.innerHTML = appState.tables.map(t => `
                <label class="flex items-center space-x-2 text-xs text-gray-300 cursor-pointer">
                    <input type="checkbox" name="action-tables" value="${t.id}" class="rounded bg-gray-900 border-gray-700 text-amber-500 focus:ring-amber-500">
                    <span>T${t.id}</span>
                </label>
            `).join('');

            slotsContainer.innerHTML = OPERATING_SLOTS.map((s, idx) => `
                <label class="flex items-center space-x-2 text-xs text-gray-300 cursor-pointer">
                    <input type="checkbox" name="action-slots" value="${s}" class="rounded bg-gray-900 border-gray-700 text-amber-500 focus:ring-amber-500">
                    <span>${s.split(' - ')[0]}</span>
                </label>
            `).join('');
        }

        function toggleActionFields() {
            const type = document.getElementById('action-type').value;
            const priceContainer = document.getElementById('walkin-price-container');
            if (type === 'WALK_IN') {
                priceContainer.classList.remove('hidden');
            } else {
                priceContainer.classList.add('hidden');
            }
        }

        async function handleActionFormSubmit(e) {
            e.preventDefault();
            const actionType = document.getElementById('action-type').value;
            const price = document.getElementById('action-price').value;
            
            const selectedTables = Array.from(document.querySelectorAll('input[name="action-tables"]:checked')).map(el => el.value);
            const selectedSlots = Array.from(document.querySelectorAll('input[name="action-slots"]:checked')).map(el => el.value);

            if (selectedTables.length === 0 || selectedSlots.length === 0) {
                alert('Please select at least one table and one time slot.');
                return;
            }

            try {
                const res = await fetch('/api/admin/action-item', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': appState.adminToken
                    },
                    body: JSON.stringify({
                        actionType,
                        price: priceInput !== '' ? Number(priceInput) : null,
                        tables: selectedTables,
                        slots: selectedSlots,
                        date: appState.selectedDate
                    })
                });

                if (res.ok) {
                    document.getElementById('action-items-form').reset();
                    toggleActionFields();
                    await loadAdminData();
                    switchAdminTab('matrix');
                } else {
                    const data = await res.json();
                    alert(`Failed: ${data.error || 'Could not apply action item'}`);
                }
            } catch (err) {
                console.error('Action submission error:', err);
            }
        }

        function renderFloorPlan() {
            const grid = document.getElementById('pool-table-grid');
            grid.innerHTML = '';

            appState.tables.forEach(table => {
                const booking = appState.bookings.find(b => b.table_id === table.id);
                const status = booking ? booking.status : 'AVAILABLE';
                const price = table.hourly_rate || table.price || 50;

                let displayText = 'Ready to Book';
                if (status === 'CONFIRMED' || status === 'RESERVED') displayText = 'Reserved';
                else if (status === 'WALK_IN') displayText = 'Walk-In Occupied';
                else if (status === 'MAINTENANCE') displayText = 'Under Maintenance';

                const card = document.createElement('div');
                card.className = "bg-gray-900 rounded-2xl border border-gray-800 p-4 space-y-4";
                
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-white">${table.name || 'Table ' + table.id}</h4>
                            <p class="text-xs text-felt-400 font-semibold">R${price} / hr</p>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full ${status === 'AVAILABLE' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${status}</span>
                    </div>
                    <div class="billiard-wood-frame p-2 rounded-xl text-center">
                        <div class="billiard-table-cloth h-24 rounded-lg flex flex-col items-center justify-center font-bold text-xs text-white">
                            <span>${displayText}</span>
                        </div>
                    </div>
                    <div class="action-container"></div>
                `;

                const actionContainer = card.querySelector('.action-container');
                if (status === 'AVAILABLE') {
                    const reserveTableBtn = document.createElement('button');
                    reserveTableBtn.className = "w-full py-2 bg-felt-600 hover:bg-felt-500 text-white font-semibold rounded-xl text-xs";
                    reserveTableBtn.innerText = "Reserve Table";
                    reserveTableBtn.onclick = () => openBookingModal(table.id, price);
                    actionContainer.appendChild(reserveTableBtn);
                } else {
                    const unavailBtn = document.createElement('button');
                    unavailBtn.className = "w-full py-2 bg-gray-800 text-gray-500 rounded-xl text-xs";
                    unavailBtn.disabled = true;
                    unavailBtn.innerText = "Unavailable";
                    actionContainer.appendChild(unavailBtn);
                }

                grid.appendChild(card);
            });
        }

        function openBookingModal(tableId, basePrice) {
            const bookingFee = 15;
            const totalPrice = basePrice + bookingFee;
            document.getElementById('form-table-id').value = tableId;
            document.getElementById('form-total-price').value = totalPrice;
            document.getElementById('modal-table-num').innerText = tableId;
            document.getElementById('modal-base-price').innerText = `R${basePrice}`;
            document.getElementById('modal-total-price').innerText = `R${totalPrice}`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const res = await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tableId: document.getElementById('form-table-id').value,
                    date: appState.selectedDate,
                    slot: appState.selectedSlot,
                    userName: document.getElementById('form-user-name').value,
                    phone: document.getElementById('form-user-phone').value,
                    userId,
                    bookingFee: 15,
                    totalPrice: document.getElementById('form-total-price').value
                })
            });

            if (res.ok) {
                closeBookingModal();
                loadData();
            } else {
                alert('Table reservation failed.');
            }
        }

        function openAdminAuthModal() { document.getElementById('admin-auth-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-auth-modal').classList.add('hidden'); }

        async function verifyAdminPassword() {
            const pass = document.getElementById('admin-password-input').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            if (res.ok) {
                appState.isAdmin = true;
                appState.adminToken = pass;
                document.getElementById('admin-toggle-btn').innerText = "Admin Enabled";
                document.getElementById('admin-logout-btn').classList.remove('hidden');
                document.getElementById('user-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                closeAdminModal();
                loadData();
            } else {
                alert("Incorrect password!");
            }
        }

        function adminLogout() {
            appState.isAdmin = false;
            appState.adminToken = '';
            document.getElementById('admin-toggle-btn').innerText = "Admin Login";
            document.getElementById('admin-logout-btn').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('user-view').classList.remove('hidden');
            loadData();
        }

        function onFilterChange() {
            appState.selectedDate = document.getElementById('selected-date').value;
            appState.selectedSlot = document.getElementById('selected-time-slot').value;
            loadData();
        }

        function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); }
    </script>
</body>
</html>
