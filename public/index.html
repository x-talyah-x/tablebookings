<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Lounge - Tee's 🎱 Cueflix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        felt: { 500: '#10b981', 600: '#059669', 800: '#065f46', 950: '#022c22' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f17; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-6 md:p-8 shadow-2xl text-center space-y-6">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
                TEE's 🎱 <span class="text-felt-500 text-sm">Cueflix</span>
            </h1>
            <p class="text-xs text-gray-400 mt-1">Billiards Bookings System</p>
        </div>

        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Choose Your Lounge</h2>
            
            <!-- Lounge Option 1 -->
            <button onclick="selectLounge('basils-billiards.html')" class="w-full group text-left bg-gray-950 border border-gray-800 hover:border-felt-500 rounded-2xl p-4 transition-all flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-white group-hover:text-felt-400 transition-colors">Basils Billiards Pool Lounge</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Blackball, Rasson, Chinese and 9Ball Tables</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-600 group-hover:text-felt-400 transition-colors"></i>
            </button>

             <button onclick="selectLounge('billiard-cafe.html')" class="w-full group text-left bg-gray-950 border border-gray-800 hover:border-felt-500 rounded-2xl p-4 transition-all flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-white group-hover:text-felt-400 transition-colors">Billiard Cafe Rivonia</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Blackball Tournament Tables</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-600 group-hover:text-felt-400 transition-colors"></i>
            </button>

          
        </div>

        <p class="text-[11px] text-gray-500">Clicking a location will take you straight to live table reservations.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        function selectLounge(loungeName) {
            // Encode the lounge name to safely pass it in URL parameters and redirect to index.html
            const encodedLounge = encodeURIComponent(loungeName);
            window.location.href = `${encodedLounge}`;
        }
    </script>
</body>
</html>
